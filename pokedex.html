<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="pokedex.js"></script>
    <link rel="stylesheet" href="./style.css" />

    <title>Mein Pokédex - Pokédex Tagebuch</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="flex items-center gap-3 bg-amber-400">
        <img src="icons/icon-logo.svg" alt="logo" width="40px" />
        <div class="flex-1">
          <div class="flex items-start justify-between">
            <span>Pokedex Tagebuch</span>
            <!-- Zähler -->
            <div>Gefangen: 25</div>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="flex items-center justify-center">
        <nav>
          <a href="index.html"> Startseite</a>
          <a href="pokedex.html">Mein Pokedex</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- Seitentitel -->
      <div>
        <div>
          <h1>Mein Pokedex-Tagebuch</h1>
          <span
            >Lorem ipsum dolor sit amet, consectetur adipisicing elit. Labore
            iste fugit doloremque suscipit culpa sapiente, nulla odit ullam.
            Unde, voluptates.</span
          >
        </div>
        <p></p>
      </div>

      <!-- Zusammenfassung -->
      <div class="flex items-center gap-3">
        <div class="flex flex-row gap-3">
          <div>
            <img src="icons/icon-check-circle.svg" alt="" />
          </div>
          <div class="flex flex-col gap-3">
            <span>Gefangene Pokemone</span>
            <span id="stat-caught-count">3 Einträge</span>
          </div>
        </div>
        <div class="flex flex-row gap-4">
          <div>
            <img src="icons/icon-edit-pencil.svg" alt="" />
          </div>
          <div class="flex flex-col gap-3">
            <span>Notizen Erstellt</span>
            <span id="stat-notes-count">4 Notizen</span>
          </div>
        </div>
      </div>

      <!-- Filter-Tabs -->
      <div id="filter-tabs" class="flex items-center gap-3 bg-amber-400">
        <button data-filter="all">Alle geafngen</button>
        <button data-filter="notes">Mit notizen</button>
        <button data-filter="favs">Favoriten</button>
      </div>

      <!-- Tagebuch-Liste: Karten werden per JS aus localStorage gerendert -->
      <div id="pokedex-list"></div>

      <!-- Toast -->
      <div id="catch-toast">
        <div>
          <span id="toast-message"></span>
        </div>
      </div>
    </main>
  </body>
  <footer></footer>
</html>
