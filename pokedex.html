<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="./style.css" />

    <title>Mein Pokédex - Pokédex Tagebuch</title>
    <style type="text/tailwindcss">
      @theme {
        --font-primary: "Plus Jakarta Sans", system-ui, sans-serif;
        --font-title: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;

        --color-bg-main: #faf8ff;
        --color-bg-card: #ffffff;
        --color-bg-secondary: #eef2ff;

        --color-accent: #ee3e33;
        --color-text-accent: #1e293b;
        --color-text-primary: #5c403c;
        --color-text-secondary: #ffffff;

        --color-btn-blue: #e0e7ff;
        --color-btn-yellow: #fef3c7;
        --color-btn-delete: #fecaca;

        --color-stat-low: #ba1a1a;
        --color-stat-medium: #f2c000;
        --color-stat-high: #10b981;

        --color-type-normal: #a8a878;
        --color-type-fire: #f08030;
        --color-type-water: #6890f0;
        --color-type-electric: #f8d030;
        --color-type-grass: #78c850;
        --color-type-ice: #98d8d8;
        --color-type-fighting: #c03028;
        --color-type-poison: #a040a0;
        --color-type-ground: #e0c068;
        --color-type-flying: #a890f0;
        --color-type-psychic: #f85888;
        --color-type-bug: #a8b820;
        --color-type-rock: #b8a038;
        --color-type-ghost: #705898;
        --color-type-dragon: #7038f8;
        --color-type-dark: #705848;
        --color-type-steel: #b8b8d0;
        --color-type-fairy: #ee99ac;
      }
      @layer base {
        html {
          @apply text-xs sm:text-sm lg:text-base leading-relaxed;
        }
        body {
          @apply container mx-auto antialiased font-primary bg-bg-main text-text-primary;
        }
        h1 {
          @apply text-2xl sm:text-3xl lg:text-4xl font-extrabold text-text-accent;
        }
        h2 {
          @apply text-lg md:text-xl lg:text-2xl font-bold text-text-accent;
        }
        button {
          @apply text-xs sm:text-sm font-bold tracking-wide py-2.5 px-4 rounded-xl;
        }
      }
      @utility pokemon-number {
        @apply text-xs sm:text-sm font-mono font-bold;
      }
      @utility pokemon-details {
        @apply text-[11px] sm:text-xs font-bold tracking-wider;
      }

    
      .badges {
        @apply flex flex-wrap gap-1.5 mt-1 justify-center;

        span {
          @apply px-3 py-1 text-xs uppercase font-bold rounded-full inline-block;
        }
        .badge-normal {
          @apply bg-stone-200;
        }
        .badge-fire {
          @apply bg-orange-200;
        }
        .badge-water {
          @apply bg-blue-200;
        }
        .badge-grass {
          @apply bg-emerald-200;
        }
        .badge-electric {
          @apply bg-amber-200;
        }
        .badge-ice {
          @apply bg-cyan-200;
        }
        .badge-fighting {
          @apply bg-red-200;
        }
        .badge-poison {
          @apply bg-purple-200;
        }
        .badge-ground {
          @apply bg-amber-200;
        }
        .badge-flying {
          @apply bg-indigo-200;
        }
        .badge-psychic {
          @apply bg-pink-200;
        }
        .badge-bug {
          @apply bg-lime-200;
        }
        .badge-rock {
          @apply bg-yellow-200;
        }
        .badge-ghost {
          @apply bg-violet-200;
        }
        .badge-dragon {
          @apply bg-indigo-200;
        }
        .badge-dark {
          @apply bg-zinc-200;
        }
        .badge-steel {
          @apply bg-slate-200;
        }
        .badge-fairy {
          @apply bg-rose-100;
        }
      }

      .type-normal {
        background: linear-gradient(to bottom left, #e7e5e4, #ffffff 50%);
      }
      .type-fire {
        background: linear-gradient(to bottom left, #fed7aa, #ffffff 50%);
      }
      .type-water {
        background: linear-gradient(to bottom left, #bfdbfe, #ffffff 50%);
      }
      .type-grass {
        background: linear-gradient(to bottom left, #a7f3d0, #ffffff 50%);
      }
      .type-electric {
        background: linear-gradient(to bottom left, #fde68a, #ffffff 50%);
      }
      .type-ice {
        background: linear-gradient(to bottom left, #a5f3fc, #ffffff 50%);
      }
      .type-fighting {
        background: linear-gradient(to bottom left, #fca5a5, #ffffff 50%);
      }
      .type-poison {
        background: linear-gradient(to bottom left, #e9d5ff, #ffffff 50%);
      }
      .type-ground {
        background: linear-gradient(to bottom left, #fde68a, #ffffff 50%);
      }
      .type-flying {
        background: linear-gradient(to bottom left, #c7d2fe, #ffffff 50%);
      }
      .type-psychic {
        background: linear-gradient(to bottom left, #fbcfe8, #ffffff 50%);
      }
      .type-bug {
        background: linear-gradient(to bottom left, #d9f99d, #ffffff 50%);
      }
      .type-rock {
        background: linear-gradient(to bottom left, #fef08a, #ffffff 50%);
      }
      .type-ghost {
        background: linear-gradient(to bottom left, #ddd6fe, #ffffff 50%);
      }
      .type-dragon {
        background: linear-gradient(to bottom left, #c7d2fe, #ffffff 50%);
      }
      .type-dark {
        background: linear-gradient(to bottom left, #e4e4e7, #ffffff 50%);
      }
      .type-steel {
        background: linear-gradient(to bottom left, #cbd5e1, #ffffff 50%);
      }
      .type-fairy {
        background: linear-gradient(to bottom left, #ffe4e6, #ffffff 50%);
      }

      .card {
        @apply flex flex-col items-center gap-2 sm:gap-3 p-3 sm:p-4
               w-full max-w-90 md:max-w-xs lg:max-w-72 xl:max-w-80
               border-2 shadow-lg rounded-2xl;
      }

      .card .img-wrapper {
        @apply w-full flex items-center justify-between;
      }
      .card .pokemon-number {
        @apply px-3 py-1 rounded-2xl bg-btn-yellow text-text-accent;
      }
      .card .pokemon-favorite {
        @apply p-2 rounded-full bg-bg-secondary;
      }
      .card .pokemon-favorite img {
        @apply w-4 h-4 sm:w-5 sm:h-5;
      }
      .card > img {
        @apply w-32 sm:w-40 md:w-48 h-auto;
      }
      .card .pokemon-name {
        @apply text-lg sm:text-xl md:text-2xl font-bold text-text-accent;
      }

     
      .card .card-stats {
        @apply flex flex-col w-full gap-2 mt-1;
      }
      .card .card-stats .stats-head {
        @apply flex justify-between items-center;
      }
      .card .card-stats .stats-grid {
        @apply grid grid-cols-2 gap-x-4 gap-y-2;
      }
      .card .stat-item {
        @apply flex flex-col gap-1;
      }
      .card .stat-item .stat-label {
        @apply flex justify-between pokemon-details text-text-accent;
      }
      .card .stat-item .stat-track {
        @apply w-full h-2 rounded-full bg-bg-secondary overflow-hidden;
      }
      .card .stat-item .stat-fill {
        @apply h-full rounded-full;
      }

    
      .card .card-comment {
        @apply flex flex-col w-full gap-1.5 sm:gap-2 border-t pt-3 mt-1;
      }

    
      .card .type-chip {
        @apply inline-flex items-center gap-1.5 px-3 py-1 rounded-full
               bg-btn-yellow text-text-accent text-xs font-bold uppercase;
      }
      .card .type-dot {
        @apply w-2 h-2 rounded-full;
      }
      .card .card-comment label {
        @apply flex items-center gap-1.5 text-xs sm:text-sm font-bold uppercase text-accent;
      }
      .card .card-comment label img {
        @apply w-4 h-4;
      }
      .card .card-comment textarea {
        @apply text-sm w-full rounded-lg bg-bg-secondary/50 border-0 p-3 resize-none
               italic text-text-primary placeholder:text-text-primary/50;
      }
      .card .btn-controllers {
        @apply flex w-full gap-2;
      }
      .card .btn-controllers button {
        @apply flex-1 flex items-center justify-center gap-1.5
               text-xs sm:text-sm rounded-xl py-2;
      }
      .card .btn-controllers button img {
        @apply w-3.5 h-3.5 sm:w-4 sm:h-4;
      }
      .card .btn-update,
      .card .btn-save {
        @apply text-text-primary bg-bg-secondary;
      }
      .card .btn-delete {
        @apply text-accent bg-btn-delete/40;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="flex flex-col gap-4 mb-8 pt-2">
      <div
        class="flex flex-col md:flex-row items-center justify-between bg-bg-card p-4 rounded-3xl shadow-sm gap-4"
      >
        <div class="flex items-center justify-between w-full md:w-auto">
          <div class="flex items-center gap-3">
            <div
              class="w-12 h-12 bg-accent rounded-4xl flex items-center justify-center text-text-secondary shadow-sm"
            >
              <img src="icons/icon-logo.svg" alt="logo" class="w-6 h-6" />
            </div>
            <div>
              <h2 class="font-title text-xl font-bold text-text-accent">
                Pokédex Tagebuch
              </h2>
              <span
                class="inline-flex items-center gap-1 text-[11px] font-bold text-text-primary bg-bg-secondary px-2.5 py-0.5 rounded-full mt-0.5"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-accent"></span> POKÉAPI
                LIVE
              </span>
            </div>
          </div>

          <div
            class="flex md:hidden items-center gap-2 bg-amber-400 text-text-accent px-3 py-1.5 rounded-2xl font-bold text-sm shadow-sm"
          >
            <span>
              <img src="icons/icon-pokedex-journal.svg" alt="" />
            </span>
            Gefangen: 6
          </div>
        </div>

        <!-- Navigation -->
        <nav
          class="hidden md:flex items-center bg-bg-secondary/70 p-1.5 rounded-full shadow-inner gap-2"
        >
          <a
            href="index.html"
            class="flex items-center gap-2 text-text-primary px-5 py-2 rounded-full font-bold hover:bg-bg-card transition-all text-sm"
          >
            <img src="icons/icon-nav-compass.svg" alt="" class="w-4 h-4" />
            Startseite
          </a>

          <a
            href="pokedex.html"
            class="flex items-center gap-2 bg-accent text-text-secondary px-5 py-2 rounded-full font-bold transition-all shadow-sm text-sm"
          >
            <img src="icons/icon-pokedex-journal.svg" alt="" class="w-4 h-4" />

            Mein Pokédex
          </a>
        </nav>

        <div
          class="hidden md:flex items-center gap-2 bg-amber-400 text-text-accent px-4 py-2 rounded-2xl font-bold shadow-sm shrink-0"
        >
          <span>
            <img src="icons/icon-pokedex-journal.svg" alt="" />
          </span>
          Gefangen: 6
        </div>
      </div>

      <div class="flex md:hidden items-center justify-center p-2">
        <nav
          class="flex items-center bg-bg-card rounded-full p-2 shadow-md gap-2 w-full justify-center"
        >
          <a
            href="index.html"
            class="flex items-center gap-2 text-text-primary px-5 py-2.5 rounded-full font-bold text-sm shadow-sm"
          >
            <img src="icons/icon-nav-compass.svg" alt="" class="w-4 h-4" />
            Startseite
          </a>
          <a
            href="pokedex.html"
            class="flex items-center gap-2 bg-accent text-text-secondary px-5 py-2.5 rounded-full font-bold text-sm hover:bg-bg-secondary"
          >
            <img src="icons/icon-pokedex-journal.svg" alt="" class="w-4 h-4" />
            Mein Pokédex
          </a>
        </nav>
      </div>
    </header>

    <main class="flex flex-col gap-8">
      <!-- Seitentitel -->
      <div class="flex flex-col gap-2 p-4">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h1
            class="font-title text-2xl sm:text-3xl lg:text-4xl font-extrabold text-text-accent tracking-tight"
          >
            MEIN POKÉDEX-TAGEBUCH
          </h1>
        </div>
        <p class="text-text-primary text-sm sm:text-base">
          Synchronisierte Feldforschungsdaten, individuelle Kampfwerte und
          persönliche Notizen des Trainers.
        </p>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-2 gap-4 px-3">
        <div
          class="bg-bg-card p-6 rounded-3xl shadow-sm flex items-center gap-5"
        >
          <div
            class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center shrink-0"
          >
            <img src="icons/icon-check-circle.svg" alt="" class="w-8 h-8" />
          </div>
          <div class="flex flex-col">
            <span
              class="text-xs font-bold text-text-primary uppercase tracking-wider"
              >Gefangene Pokémone</span
            >
            <span
              id="stat-caught-count"
              class="font-title text-3xl sm:text-4xl font-extrabold text-text-accent mt-1"
              >4</span
            >
            <span class="text-sm font-semibold text-text-primary"
              >Einträge</span
            >
          </div>
        </div>

        <div
          class="bg-bg-card p-6 rounded-3xl shadow-sm flex items-center gap-5"
        >
          <div
            class="w-16 h-16 bg-amber-50 rounded-2xl flex items-center justify-center shrink-0"
          >
            <img src="icons/icon-edit-pencil.svg" alt="" class="w-8 h-8" />
          </div>
          <div class="flex flex-col">
            <span
              class="text-xs font-bold text-text-primary uppercase tracking-wider"
              >Notizen Erstellt</span
            >
            <span
              id="stat-notes-count"
              class="font-title text-2xl sm:text-3xl font-extrabold text-text-accent mt-1"
              >3 Notizen</span
            >
          </div>
        </div>
      </div>

      <!-- Filter-Tabs -->
      <div
        id="filter-tabs"
        class="flex items-center bg-bg-card p-2 rounded-full shadow-sm gap-2 max-w-fit overflow-x-auto"
      >
        <button
          data-filter="all"
          class="bg-accent text-text-secondary px-6 py-2.5 rounded-full font-bold transition shadow-sm cursor-pointer whitespace-nowrap"
        >
          Alle gefangenen
        </button>
        <button
          data-filter="notes"
          class="text-text-primary px-6 py-2.5 rounded-full font-bold hover:bg-bg-secondary transition cursor-pointer whitespace-nowrap"
        >
          Mit Notizen
        </button>
        <button
          data-filter="favs"
          class="text-text-primary px-6 py-2.5 rounded-full font-bold hover:bg-bg-secondary transition cursor-pointer flex items-center gap-1.5 whitespace-nowrap"
        >
          Favoriten <span>⭐</span>
        </button>
      </div>



      <!-- Tagebuch-Liste: Karten werden per JS aus localStorage gerendert -->
      <div
        id="pokedex-list"
        class="flex flex-wrap justify-center gap-4 md:gap-5 lg:gap-6 px-4"
      >

      <!-- Toast -->
      <div id="catch-toast">
        <div>
          <span id="toast-message"></span>
        </div>
      </div>
    </main>
    <script src="pokedex.js" defer></script>
  </body>
  <footer></footer>
</html>
