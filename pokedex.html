<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="pokedex.js"></script>
    <link rel="stylesheet" href="./style.css" />

    <title>Mein Pokédex - Pokédex Tagebuch</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <div>
        <!-- Logo -->
        <div>
          <div><!-- Icon --></div>
          <div>
            <span><!-- Titel --></span>
            <div><!-- Status-Badge --></div>
          </div>
        </div>

        <!-- Navigation -->
        <nav>
          <a href="index.html"></a>
          <a href="pokedex.html"></a>
        </nav>

        <!-- Zähler -->
        <div><!-- Zähler --></div>
      </div>
    </header>

    <main>
      <!-- Sync-Anzeige -->
      <div></div>

      <!-- Seitentitel -->
      <div>
        <div>
          <h1></h1>
          <span></span>
        </div>
        <p></p>
      </div>

      <!-- Zusammenfassung -->
      <div>
        <div>
          <div><!-- Icon --></div>
          <div>
            <span></span>
            <span id="stat-caught-count"></span>
          </div>
        </div>
        <div>
          <div><!-- Icon --></div>
          <div>
            <span></span>
            <span id="stat-notes-count"></span>
          </div>
        </div>
      </div>

      <!-- Filter-Tabs -->
      <div id="filter-tabs">
        <button data-filter="all"></button>
        <button data-filter="notes"></button>
        <button data-filter="favs"></button>
      </div>

      <!-- Tagebuch-Liste: Karten werden per JS aus localStorage gerendert -->
      <div id="pokedex-list"></div>

      <!-- Toast -->
      <div id="catch-toast">
        <div>
          <span id="toast-message"></span>
        </div>
      </div>
    </main>
  </body>
  <footer></footer>
</html>
