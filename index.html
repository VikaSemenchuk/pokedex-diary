<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="./style.css" />

    <title>Startseite - Pokédex Tagebuch</title>
    <style type="text/tailwindcss">
      @theme {
        --font-primary: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-title: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --color-bg-main: #faf8ff;
        --color-bg-card: #ffffff;
        --color-bg-secondary: #eef2ff;

        --color-accent: #ee3e33;
        --color-text-accent: #1e293b;
        --color-text-primary: #5c403c;
        --color-text-secondary: #ffffff;

        --color-btn-blue: #e0e7ff;
        --color-btn-yellow: #fef3c7;
        --color-btn-delete: #fecaca;

        --color-stat-low: #ba1a1a;
        --color-stat-medium: #f2c000;
        --color-stat-high: #10b981;

        --color-badge-normal: #a8a878;
        --color-badge-fire: #f08030;
        --color-badge-water: #6890f0;
        --color-badge-electric: #f8d030;
        --color-badge-grass: #78c850;
        --color-badge-ice: #98d8d8;
        --color-badge-fighting: #c03028;
        --color-badge-poison: #a040a0;
        --color-badge-ground: #e0c068;
        --color-badge-flying: #a890f0;
        --color-badge-psychic: #f85888;
        --color-badge-bug: #a8b820;
        --color-badge-rock: #b8a038;
        --color-badge-ghost: #705898;
        --color-badge-dragon: #7038f8;
        --color-badge-dark: #705848;
        --color-badge-steel: #b8b8d0;
        --color-badge-fairy: #ee99ac;
      }
      @layer base {
        html {
          @apply text-xs sm:text-sm lg:text-base leading-relaxed;
        }
        body {
          @apply container mx-auto antialiased font-primary bg-bg-main text-text-primary;
        }
        h1 {
          @apply text-2xl sm:text-3xl lg:text-4xl font-extrabold text-text-accent;
        }
        h2 {
          @apply text-lg md:text-xl lg:text-2xl font-bold text-text-accent;
        }
        button {
          @apply text-xs sm:text-sm font-bold tracking-wide py-2.5 px-4 rounded-xl cursor-pointer;
        }
      }
      @utility pokemon-number {
        @apply text-xs sm:text-sm font-mono font-bold;
      }
      @utility pokemon-details {
        @apply text-[11px] sm:text-xs font-bold tracking-wider;
      }

      #pokemon-list > div {
        @apply rounded bg-white shadow transition-all;

        .params {
          @apply px-4 mt-4 flex justify-between;

          .id {
            @apply text-xs rounded-full px-3 py-1 bg-gray-100;
          }
        }
        .img {
          @apply mb-4 p-1;
        }
        .title {
          @apply text-center text-lg md:text-xl lg:text-2xl font-bold text-text-accent uppercase px-4 pb-1;
        }
        .bages {
          @apply flex flex-wrap gap-1.5 mt-1 px-4 pb-4 justify-center;

          span {
            @apply px-3 py-1 text-xs uppercase font-bold rounded-full inline-block;
          }
          .badge-normal {
            @apply bg-stone-200;
          }
          .badge-fire {
            @apply bg-orange-200;
          }
          .badge-water {
            @apply bg-blue-200;
          }
          .badge-grass {
            @apply bg-emerald-200;
          }
          .badge-electric {
            @apply bg-amber-200;
          }
          .badge-ice {
            @apply bg-cyan-200;
          }
          .badge-fighting {
            @apply bg-red-200;
          }
          .badge-poison {
            @apply bg-purple-200;
          }
          .badge-ground {
            @apply bg-amber-200;
          }
          .badge-flying {
            @apply bg-indigo-200;
          }
          .badge-psychic {
            @apply bg-pink-200;
          }
          .badge-bug {
            @apply bg-lime-200;
          }
          .badge-rock {
            @apply bg-yellow-200;
          }
          .badge-ghost {
            @apply bg-violet-200;
          }
          .badge-dragon {
            @apply bg-indigo-200;
          }
          .badge-dark {
            @apply bg-zinc-200;
          }
          .badge-steel {
            @apply bg-slate-200;
          }
          .badge-fairy {
            @apply bg-rose-100;
          }
        }
        .descr {
          @apply px-4 mb-2;
        }
        .actions {
          @apply text-center px-4 mb-4;

          button {
            @apply rounded-full bg-accent text-white;
          }
          button:disabled {
            @apply rounded-full bg-gray-400 text-white;
          }
        }
      }
      #pokemon-list > div:hover {
        @apply shadow-xl;
      }
      .type-normal {
        background: linear-gradient(to bottom left, #e7e5e4, #ffffff 50%);
      }
      .type-fire {
        background: linear-gradient(to bottom left, #fed7aa, #ffffff 50%);
      }
      .type-water {
        background: linear-gradient(to bottom left, #bfdbfe, #ffffff 50%);
      }
      .type-grass {
        background: linear-gradient(to bottom left, #a7f3d0, #ffffff 50%);
      }
      .type-electric {
        background: linear-gradient(to bottom left, #fde68a, #ffffff 50%);
      }
      .type-ice {
        background: linear-gradient(to bottom left, #a5f3fc, #ffffff 50%);
      }
      .type-fighting {
        background: linear-gradient(to bottom left, #fca5a5, #ffffff 50%);
      }
      .type-poison {
        background: linear-gradient(to bottom left, #e9d5ff, #ffffff 50%);
      }
      .type-ground {
        background: linear-gradient(to bottom left, #fde68a, #ffffff 50%);
      }
      .type-flying {
        background: linear-gradient(to bottom left, #c7d2fe, #ffffff 50%);
      }
      .type-psychic {
        background: linear-gradient(to bottom left, #fbcfe8, #ffffff 50%);
      }
      .type-bug {
        background: linear-gradient(to bottom left, #d9f99d, #ffffff 50%);
      }
      .type-rock {
        background: linear-gradient(to bottom left, #fef08a, #ffffff 50%);
      }
      .type-ghost {
        background: linear-gradient(to bottom left, #ddd6fe, #ffffff 50%);
      }
      .type-dragon {
        background: linear-gradient(to bottom left, #c7d2fe, #ffffff 50%);
      }
      .type-dark {
        background: linear-gradient(to bottom left, #e4e4e7, #ffffff 50%);
      }
      .type-steel {
        background: linear-gradient(to bottom left, #cbd5e1, #ffffff 50%);
      }
      .type-fairy {
        background: linear-gradient(to bottom left, #ffe4e6, #ffffff 50%);
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="flex flex-col gap-4 mb-8 pt-2">
      <div
        class="flex flex-col md:flex-row items-center justify-between bg-bg-card p-4 rounded-3xl shadow-sm gap-4"
      >
        <div class="flex items-center justify-between w-full md:w-auto">
          <div class="flex items-center gap-3">
            <!-- <div
              class="w-12 h-12 bg-accent rounded-4xl flex items-center justify-center text-text-secondary shadow-sm"
            >
              <img src="icons/icon-logo.svg" alt="logo" class="w-6 h-6"  />
            </div> -->
            <img src="icons/icon-logo.svg" alt="logo" class="w-12 h-12"  />
            <div>
              <h2 class="font-title text-xl font-bold text-text-accent">
                Pokédex Tagebuch
              </h2>
              <span
                class="inline-flex items-center gap-1 text-[11px] font-bold text-text-primary bg-bg-secondary px-2.5 py-0.5 rounded-full mt-0.5"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-accent"></span> POKÉAPI
                LIVE
              </span>
            </div>
          </div>

          <div
            class="flex md:hidden items-center gap-2 bg-amber-400 text-text-accent px-3 py-1.5 rounded-2xl font-bold text-sm shadow-sm"
          >
            <span>
              <img src="icons/icon-pokedex-journal.svg" alt="" />
            </span>
            Gefangen: 6
          </div>
        </div>

        <!-- Navigation -->
        <nav
          class="hidden md:flex items-center bg-bg-secondary/70 p-1.5 rounded-full shadow-inner gap-2"
        >
          <a
            href="index.html"
            class="flex items-center gap-2 bg-accent text-text-secondary px-5 py-2.5 rounded-full font-bold text-sm shadow-sm"
          >
            <svg class="w-4 h-4 shrink-0">
        <use href="./icons/sprite.svg#icon-nav-compass"></use>
            </svg>
            <span class="hidden md:inline">Startseite</span>
          </a>

          <a
            href="pokedex.html"
            class="flex items-center gap-2 text-text-primary px-5 py-2.5 rounded-full font-bold text-sm hover:bg-bg-secondary"
          >
             <svg class="w-4 h-4 shrink-0">
                <use href="./icons/sprite.svg#icon-pokedex-journal"></use>
            </svg>
            <span class="hidden md:inline">Mein Pokédex</span>
          </a>
        </nav>

        <div
          class="hidden md:flex items-center gap-2 bg-amber-400 text-text-accent px-4 py-2 rounded-2xl font-bold shadow-sm shrink-0"
        >
          <span>
            <img src="icons/icon-pokedex-journal.svg" alt="" />
          </span>
          Gefangen: 6
        </div>
      </div>
    </header>
    <div
      class="sticky top-0 z-40 flex md:hidden items-center justify-center p-1"
    >
      <nav
        class="flex items-center bg-bg-card rounded-full p-2 shadow-md gap-2 w-full justify-center"
      >
        <a
          href="index.html"
          class="flex items-center gap-2 bg-accent text-text-secondary px-5 py-2.5 rounded-full font-bold text-sm shadow-sm"
        >
          <svg class="w-4 h-4 shrink-0">
        <use href="./icons/sprite.svg#icon-nav-compass"></use>
            </svg>
            <span class=" md:inline">Startseite</span>
        </a>
        <a
          href="pokedex.html"
          class="flex items-center gap-2 text-text-primary px-5 py-2.5 rounded-full font-bold text-sm hover:bg-bg-secondary"
        >
           <svg class="w-4 h-4 shrink-0">
                <use href="./icons/sprite.svg#icon-pokedex-journal"></use>
            </svg>
            <span class="md:inline">Mein Pokédex</span>
        </a>
      </nav>
    </div>
    <main>
      <!-- Suche -->
      <section class="pb-5 px-2 p-5">
        <form id="search-form">
          <div
            class="bg-white rounded-3xl p-2 relative w-full max-w-md flex items-center"
          >
            <input
              type="text"
              id="search-input"
              placeholder="Finde dein Pokémon."
              class="w-full bg-transparent px-4 py-1 outline-none border-none focus:ring-0 autofill:bg-transparent [&:-webkit-autofill]:delay-[9999s] blinking-placeholder"
              
              />
            </div>
          </form>
        </section>
        <!-- class="w-full bg-transparent px-4 py-1 outline-none border-none focus:ring-0 autofill:bg-transparent [&:-webkit-autofill]:[transition-delay:9999s] blinking-placeholder" -->

      <!-- Filter-Chips -->
      <section class="w-full pb-7 pt-2 p-3">
        <div id="type-filter" class="flex flex-wrap justify-center gap-2">
          <button
            data-filter="all"
            class="active text-white group flex items-center gap-2.5 bg-accent px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-slate-400 border border-white/50"
            ></span>
            <span>All</span>
          </button>

          <button
            data-filter="normal"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#a8a878] border border-white/50"
            ></span>
            <span>Normal</span>
          </button>

          <button
            data-filter="fire"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#F08030] border border-white/50"
            ></span>
            <span>Fire</span>
          </button>

          <button
            data-filter="water"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#6890F0] border border-white/50"
            ></span>
            <span>Water</span>
          </button>

          <button
            data-filter="grass"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#f8d030] border border-white/50"
            ></span>
            <span>Grass</span>
          </button>

          <button
            data-filter="electric"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#78c850] border border-white/50"
            ></span>
            <span>Electric</span>
          </button>

          <button
            data-filter="ice"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#98d8d8] border border-white/50"
            ></span>
            <span>Ice</span>
          </button>

          <button
            data-filter="fighting"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#c03028] border border-white/50"
            ></span>
            <span>Fighting</span>
          </button>

          <button
            data-filter="poison"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#a040a0] border border-white/50"
            ></span>
            <span>Poison</span>
          </button>

          <button
            data-filter="ground"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#e0c068] border border-white/50"
            ></span>
            <span>Ground</span>
          </button>

          <button
            data-filter="flying"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#A890F0] border border-white/50"
            ></span>
            <span>Flying</span>
          </button>

          <button
            data-filter="psychic"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#F85888] border border-white/50"
            ></span>
            <span>Psychic</span>
          </button>

          <button
            data-filter="bug"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#A8B820] border border-white/50"
            ></span>
            <span>Bug</span>
          </button>

          <button
            data-filter="rock"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#b8a038] border border-white/50"
            ></span>
            <span>Rock</span>
          </button>

          <button
            data-filter="ghost"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#705898] border border-white/50"
            ></span>
            <span>Ghost</span>
          </button>

          <button
            data-filter="dragon"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#7038f8] border border-white/50"
            ></span>
            <span>Dragon</span>
          </button>

          <button
            data-filter="dark"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#705848] border border-white/50"
            ></span>
            <span>Dark</span>
          </button>

          <button
            data-filter="steel"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#b8b8d0] border border-white/50"
            ></span>
            <span>Steel</span>
          </button>

          <button
            data-filter="fairy"
            class="group flex items-center gap-2.5 bg-[#E2E7FF] px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition hover:bg-accent"
          >
            <span
              class="w-3 h-3 rounded-full bg-[#EE99AC] border border-white/50"
            ></span>
            <span>Fairy</span>
          </button>
        </div>
      </section>

      <section
        id="pokemon-list"
        class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
      ></section>
      <div id="pokemon-scroll-trigger" class="h-4"></div>

      <div id="search-modal">
        <div>
          <div>
            <div></div>
            <button id="modal-close-btn"></button>
          </div>

          <div>
            <div>
              <img id="modal-img" src="" alt="" />
            </div>
            <div>
              <h3 id="modal-name"></h3>
              <div id="modal-types"></div>
              <span id="modal-ability"></span>
            </div>
          </div>

          <div id="modal-stats"></div>

          <div>
            <button id="modal-catch-btn"></button>
          </div>
        </div>
      </div>

      <div id="catch-toast">
        <span id="toast-message"></span>
      </div>
    </main>
    <footer
      class="flex items-center justify-center md:justify-normal py-6 px-4 text-center border-t border-bg-secondary/50 mt-4"
    >
      <p class="text-xs text-text-primary/60">
        © 2026
        <a
          href="https://pokeapi.co"
          target="_blank"
          rel="noopener noreferrer"
          class="font-semibold text-accent hover:underline"
          >PokéAPI</a
        >. Alle Rechte vorbehalten.
      </p>
    </footer>
    <script type="module" src="main.js"></script>
  </body>
  <!-- Back to Top Button -->
  <button
    id="backToTopBtn"
    aria-label="Oben"
    class="fixed right-6 z-50 flex h-12 w-12 sm:h-14 sm:w-14 items-center justify-center rounded-full bg-amber-300 text-white shadow-xl transition-all duration-300 ease-in-out opacity-0 translate-y-4 pointer-events-none hover:bg-amber-400 active:scale-95 focus:outline-none"
    style="bottom: max(1.5rem, env(safe-area-inset-bottom))"
  >
    <svg
      class="h-6 w-6 sm:h-7 sm:w-7"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M5 15l7-7 7 7"
      ></path>
    </svg>
  </button>
</html>
