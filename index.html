<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css" />
    <script src="main.js" defer></script>
    <title>Startseite - Pokédex Tagebuch</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="flex items-center gap-3 bg-amber-400">
        <img src="icons/icon-logo.svg" alt="logo" width="40px" />
        <div class="flex-1">
          <div class="flex items-start justify-between">
            <span>Pokedex Tagebuch</span>
            <!-- Zähler -->
             <div>Gefangen:  54</div>
          </div>
        </div>
      </div>
      <!-- Navigation -->
      <div class="flex items-center justify-center">
        <nav>
          <a href="index.html"> Startseite</a>
          <a href="pokedex.html">Mein Pokedex</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- Suche -->
      <section  class="bg-amber-500">
        <form id="search-form" >
          <input type="text" id="search-input" placeholder="Gengar" />
          <button type="submit">Suchen</button>
        </form>
      </section>

      <!-- Filter-Chips -->
      <section>
        <div id="filter-container">
          <button data-type="all"></button>
          <button data-type="Feuer"></button>
          <button data-type="Wasser"></button>
          <button data-type="Pflanze"></button>
          <button data-type="Elektro"></button>
        </div>
      </section>

      <!-- Item-Grid: Karten werden per JS aus der API gerendert -->
      <section id="pokemon-roster"></section>

      <!-- Modal -->
      <div id="search-modal">
        <div>
          <!-- Modal-Kopfzeile -->
          <div>
            <div></div>
            <button id="modal-close-btn"></button>
          </div>

          <!-- Modal-Steckbrief -->
          <div>
            <div>
              <img id="modal-img" src="" alt="" />
            </div>
            <div>
              <h3 id="modal-name"></h3>
              <div id="modal-types"></div>
              <span id="modal-ability"></span>
            </div>
          </div>

          <!-- Modal-Statuswerte -->
          <div id="modal-stats"></div>

          <!-- Modal-Aktion -->
          <div>
            <button id="modal-catch-btn"></button>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div id="catch-toast">
        <span id="toast-message"></span>
      </div>
    </main>
  </body>
  <footer></footer>
</html>
