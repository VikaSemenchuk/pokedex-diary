<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css" />

    <title>Startseite - Pokédex Tagebuch</title>
    <style type="text/tailwindcss">
      @theme {
        --font-primary: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-title: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --color-bg-main: #faf8ff;
        --color-bg-card: #ffffff;
        --color-bg-secondary: #eef2ff;

        --color-accent: #ee3e33;
        --color-text-accent: #1e293b;
        --color-text-primary: #5c403c;
        --color-text-secondary: #ffffff;

        --color-btn-blue: #e0e7ff;
        --color-btn-yellow: #fef3c7;
        --color-btn-delete: #fecaca;

        --color-stat-low: #ba1a1a;
        --color-stat-medium: #f2c000;
        --color-stat-high: #10b981;

        --color-type-normal: #a8a878;
        --color-type-fire: #f08030;
        --color-type-water: #6890f0;
        --color-type-electric: #f8d030;
        --color-type-grass: #78c850;
        --color-type-ice: #98d8d8;
        --color-type-fighting: #c03028;
        --color-type-poison: #a040a0;
        --color-type-ground: #e0c068;
        --color-type-flying: #a890f0;
        --color-type-psychic: #f85888;
        --color-type-bug: #a8b820;
        --color-type-rock: #b8a038;
        --color-type-ghost: #705898;
        --color-type-dragon: #7038f8;
        --color-type-dark: #705848;
        --color-type-steel: #b8b8d0;
        --color-type-fairy: #ee99ac;
      }
      @layer base {
        html {
          @apply text-xs sm:text-sm lg:text-base leading-relaxed;
        }
        body {
          @apply container mx-auto antialiased font-primary bg-bg-main text-text-primary;
        }
        h1 {
          @apply text-2xl sm:text-3xl lg:text-4xl font-extrabold text-text-accent;
        }
        h2 {
          @apply text-lg md:text-xl lg:text-2xl font-bold text-text-accent;
        }
        button {
          @apply text-xs sm:text-sm font-bold tracking-wide py-2.5 px-4 rounded-xl;
        }
      }
      @utility pokemon-number {
        @apply text-xs sm:text-sm font-mono font-bold;
      }
      @utility pokemon-details {
        @apply text-[11px] sm:text-xs font-bold tracking-wider;
      }
    </style>
  </head>

  <body>
    <!-- Header -->
     <header class="flex flex-col gap-4 mb-8 pt-2">
      <div
        class="flex flex-col md:flex-row items-center justify-between bg-bg-card p-4 rounded-3xl shadow-sm gap-4"
      >
        <div class="flex items-center justify-between w-full md:w-auto">
          <div class="flex items-center gap-3">
            <div
              class="w-12 h-12 bg-accent rounded-4xl flex items-center justify-center text-text-secondary shadow-sm"
            >
              <img src="icons/icon-logo.svg" alt="logo" class="w-6 h-6" />
            </div>
            <div>
              <h2 class="font-title text-xl font-bold text-text-accent">
                Pokédex Tagebuch
              </h2>
              <span
                class="inline-flex items-center gap-1 text-[11px] font-bold text-text-primary bg-bg-secondary px-2.5 py-0.5 rounded-full mt-0.5"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-accent"></span> POKÉAPI
                LIVE
              </span>
            </div>
          </div>

          <div
            class="flex md:hidden items-center gap-2 bg-amber-400 text-text-accent px-3 py-1.5 rounded-2xl font-bold text-sm shadow-sm"
          >
            <span>
              <img src="icons/icon-pokedex-journal.svg" alt="" />
            </span>
            Gefangen: 6
          </div>
        </div>

        <!-- Navigation -->
        <nav
          class="hidden md:flex items-center bg-bg-secondary/70 p-1.5 rounded-full shadow-inner gap-2"
        >
          <a
            href="index.html"
            class="flex items-center gap-2 bg-accent text-text-secondary px-5 py-2.5 rounded-full font-bold text-sm shadow-sm"
          >
            <img src="icons/icon-nav-compass.svg" alt="" class="w-4 h-4" />
            Startseite
          </a>

          <a
            href="pokedex.html"
            class="flex items-center gap-2 text-text-primary px-5 py-2.5 rounded-full font-bold text-sm hover:bg-bg-secondary"
          >
            <img src="icons/icon-pokedex-journal.svg" alt="" class="w-4 h-4" />
            Mein Pokédex
          </a>
        </nav>

        <div
          class="hidden md:flex items-center gap-2 bg-amber-400 text-text-accent px-4 py-2 rounded-2xl font-bold shadow-sm shrink-0"
        >
          <span>
            <img src="icons/icon-pokedex-journal.svg" alt="" />
          </span>
          Gefangen: 6
        </div>
      </div>

      <div class="flex md:hidden items-center justify-center p-2">
        <nav
          class="flex items-center bg-bg-card rounded-full p-2 shadow-md gap-2 w-full justify-center"
        >
          <a
            href="index.html"
            class="flex items-center gap-2 bg-accent text-text-secondary px-5 py-2.5 rounded-full font-bold text-sm shadow-sm"
          >
            <img src="icons/icon-nav-compass.svg" alt="" class="w-4 h-4" />
            Startseite
          </a>
          <a
            href="pokedex.html"
            class="flex items-center gap-2 text-text-primary px-5 py-2.5 rounded-full font-bold text-sm hover:bg-bg-secondary"
          >
            <img src="icons/icon-pokedex-journal.svg" alt="" class="w-4 h-4" />
            Mein Pokédex
          </a>
        </nav>
      </div>
    </header>

    <main>
      <!-- Suche -->
      <section class="p-4">
        <form id="search-form">
          <div
            class="bg-white rounded-3xl p-2 relative w-full flex items-center"
          >
            <input
              type="text"
              id="search-input"
              placeholder="Gengar..."
              class="w-full bg-transparent px-4 py-1 outline-none border-none focus:ring-0"
            />
            <button
              type="submit"
              class="bg-accent text-text-secondary absolute right-2 px-10 py-3 rounded-3xl"
            >
              Suchen
            </button>
          </div>
        </form>
      </section>

      <!-- Filter-Chips -->
      <section class="w-full overflow-x-auto py-2 no-scrollbar">
        <div
          id="filter-container"
          class="flex flex-nowrap items-center gap-3 px-4 w-max"
        >
          <button
            data-type="all"
            class="flex items-center gap-2 bg-accent text-text-secondary px-6 py-2.5 rounded-full font-bold whitespace-nowrap shadow-sm cursor-pointer transition"
          >
            Alle
          </button>

          <button
            data-type="Feuer"
            class="flex items-center gap-2 bg-bg-secondary text-text-primary px-6 py-2.5 rounded-full font-bold whitespace-nowrap hover:bg-gray-200 cursor-pointer transition"
          >
            <span
              class="w-3 h-3 rounded-full bg-type-fire pointer-events-none"
            ></span>
            Feuer
          </button>

          <button
            data-type="Wasser"
            class="flex items-center gap-2 bg-bg-secondary text-text-primary px-6 py-2.5 rounded-full font-bold whitespace-nowrap hover:bg-gray-200 cursor-pointer transition"
          >
            <span
              class="w-3 h-3 rounded-full bg-type-water pointer-events-none"
            ></span>
            Wasser
          </button>

          <button
            data-type="Pflanze"
            class="flex items-center gap-2 bg-bg-secondary text-text-primary px-6 py-2.5 rounded-full font-bold whitespace-nowrap hover:bg-gray-200 cursor-pointer transition"
          >
            <span
              class="w-3 h-3 rounded-full bg-type-grass pointer-events-none"
            ></span>
            Pflanze
          </button>

          <!-- Кнопка «Elektro» -->
          <button
            data-type="Elektro"
            class="flex items-center gap-2 bg-bg-secondary text-text-primary px-6 py-2.5 rounded-full font-bold whitespace-nowrap hover:bg-gray-200 cursor-pointer transition"
          >
            <span
              class="w-3 h-3 rounded-full bg-type-electric pointer-events-none"
            ></span>
            Elektro
          </button>
        </div>
      </section>

      <!-- Item-Grid: Karten werden per JS aus der API gerendert -->
      <section id="pokemon-roster"></section>

      <!-- Modal -->
      <div id="search-modal">
        <div>
          <!-- Modal-Kopfzeile -->
          <div>
            <div></div>
            <button id="modal-close-btn"></button>
          </div>

          <!-- Modal-Steckbrief -->
          <div>
            <div>
              <img id="modal-img" src="" alt="" />
            </div>
            <div>
              <h3 id="modal-name"></h3>
              <div id="modal-types"></div>
              <span id="modal-ability"></span>
            </div>
          </div>

          <!-- Modal-Statuswerte -->
          <div id="modal-stats"></div>

          <!-- Modal-Aktion -->
          <div>
            <button id="modal-catch-btn"></button>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div id="catch-toast">
        <span id="toast-message"></span>
      </div>
    </main>
    <script src="main.js" defer></script>
  </body>
  <footer></footer>
</html>
