<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css" />

   
    <title>Startseite - Pokédex Tagebuch</title>
    <style type="text/tailwindcss">
      @theme {
        --font-primary: "Plus Jakarta Sans", system-ui, sans-serif;
        --font-title: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;

        --color-bg-main: #faf8ff;
        --color-bg-card: #ffffff;
        --color-bg-secondary: #eef2ff;

        --color-accent: #ee3e33;
        --color-text-accent: #1e293b;
        --color-text-primary: #5c403c;
        --color-text-secondary: #ffffff;

        --color-btn-blue: #e0e7ff;
        --color-btn-yellow: #fef3c7;
        --color-btn-delete: #fecaca;

        --color-stat-low: #ba1a1a;
        --color-stat-medium: #f2c000;
        --color-stat-high: #10b981;

        --color-badge-normal: #a8a878;
        --color-badge-fire: #f08030;
        --color-badge-water: #6890f0;
        --color-badge-electric: #f8d030;
        --color-badge-grass: #78c850;
        --color-badge-ice: #98d8d8;
        --color-badge-fighting: #c03028;
        --color-badge-poison: #a040a0;
        --color-badge-ground: #e0c068;
        --color-badge-flying: #a890f0;
        --color-badge-psychic: #f85888;
        --color-badge-bug: #a8b820;
        --color-badge-rock: #b8a038;
        --color-badge-ghost: #705898;
        --color-badge-dragon: #7038f8;
        --color-badge-dark: #705848;
        --color-badge-steel: #b8b8d0;
        --color-badge-fairy: #ee99ac;
      }
      @layer base {
        html {
          @apply text-xs sm:text-sm lg:text-base leading-relaxed;
        }
        body {
          @apply container mx-auto antialiased font-primary bg-bg-main text-text-primary;
        }
        h1 {
          @apply text-2xl sm:text-3xl lg:text-4xl font-extrabold text-text-accent;
        }
        h2 {
          @apply text-lg md:text-xl lg:text-2xl font-bold text-text-accent;
        }
        button {
          @apply text-xs sm:text-sm font-bold tracking-wide py-2.5 px-4 rounded-xl cursor-pointer;
        }
      }
      @utility pokemon-number {
        @apply text-xs sm:text-sm font-mono font-bold;
      }
      @utility pokemon-details {
        @apply text-[11px] sm:text-xs font-bold tracking-wider;
      }

      #pokemon-list > div {
          @apply rounded bg-white shadow transition-all;

          .params {
              @apply px-4 mt-4 flex justify-between;

              .id {
                @apply text-xs rounded-full px-3 py-1 bg-gray-100;
              }
          }
          .img {
              @apply mb-4 p-1;
          }
          .title {
              @apply text-center text-lg md:text-xl lg:text-2xl font-bold text-text-accent uppercase px-4 pb-1;
          }
          .bages {
              @apply flex flex-wrap gap-1.5 mt-1 px-4 pb-4 justify-center;

              span {
                  @apply px-3 py-1 text-xs uppercase font-bold rounded-full inline-block;
              }
              .badge-normal   { @apply bg-stone-200; }
              .badge-fire     { @apply bg-orange-200; }
              .badge-water    { @apply bg-blue-200; }
              .badge-grass    { @apply bg-emerald-200; }
              .badge-electric { @apply bg-amber-200; }
              .badge-ice      { @apply bg-cyan-200; }
              .badge-fighting { @apply bg-red-200; }
              .badge-poison   { @apply bg-purple-200; }
              .badge-ground   { @apply bg-amber-200; }
              .badge-flying   { @apply bg-indigo-200; }
              .badge-psychic  { @apply bg-pink-200; }
              .badge-bug      { @apply bg-lime-200; }
              .badge-rock     { @apply bg-yellow-200; }
              .badge-ghost    { @apply bg-violet-200; }
              .badge-dragon   { @apply bg-indigo-200; }
              .badge-dark     { @apply bg-zinc-200; }
              .badge-steel    { @apply bg-slate-200; }
              .badge-fairy    { @apply bg-rose-100; }
          }
          .descr {
              @apply px-4 mb-2;
          }
          .actions {
            @apply text-center px-4 mb-4;

            button {
              @apply rounded-full bg-accent text-white;
            }
          }
      }
      #pokemon-list > div:hover {
          @apply shadow-xl;
      }
      .type-normal   { background: linear-gradient(to bottom left, #e7e5e4, #ffffff 50%); }
      .type-fire     { background: linear-gradient(to bottom left, #fed7aa, #ffffff 50%); }
      .type-water    { background: linear-gradient(to bottom left, #bfdbfe, #ffffff 50%); }
      .type-grass    { background: linear-gradient(to bottom left, #a7f3d0, #ffffff 50%); }
      .type-electric { background: linear-gradient(to bottom left, #fde68a, #ffffff 50%); }
      .type-ice      { background: linear-gradient(to bottom left, #a5f3fc, #ffffff 50%); }
      .type-fighting { background: linear-gradient(to bottom left, #fca5a5, #ffffff 50%); }
      .type-poison   { background: linear-gradient(to bottom left, #e9d5ff, #ffffff 50%); }
      .type-ground   { background: linear-gradient(to bottom left, #fde68a, #ffffff 50%); }
      .type-flying   { background: linear-gradient(to bottom left, #c7d2fe, #ffffff 50%); }
      .type-psychic  { background: linear-gradient(to bottom left, #fbcfe8, #ffffff 50%); }
      .type-bug      { background: linear-gradient(to bottom left, #d9f99d, #ffffff 50%); }
      .type-rock     { background: linear-gradient(to bottom left, #fef08a, #ffffff 50%); }
      .type-ghost    { background: linear-gradient(to bottom left, #ddd6fe, #ffffff 50%); }
      .type-dragon   { background: linear-gradient(to bottom left, #c7d2fe, #ffffff 50%); }
      .type-dark     { background: linear-gradient(to bottom left, #e4e4e7, #ffffff 50%); }
      .type-steel    { background: linear-gradient(to bottom left, #cbd5e1, #ffffff 50%); }
      .type-fairy    { background: linear-gradient(to bottom left, #ffe4e6, #ffffff 50%); }      

    </style>
  </head>

  <body>
    <!-- Header -->
    <header>
      <div>
        <!-- Logo -->
        <div>
          <div><!-- Icon --></div>
          <div>
            <span><!-- Titel --></span>
            <div><!-- Status-Badge --></div>
          </div>
        </div>

        <!-- Navigation -->
        <nav>
          <a href="index.html"></a>
          <a href="pokedex.html"></a>
        </nav>

        <!-- Zähler -->
        <div><!-- Zähler --></div>
      </div>
    </header>

    <main>
      <!-- Sync-Anzeige -->
      <div></div>

      <!-- Suche -->
      <section>
        <form id="search-form">
          <input type="text" id="search-input" />
          <button type="submit"></button>
        </form>
      </section>

      <!-- Filter-Chips -->
      <section>
        <div id="filter-container">
          <button data-type="all">All</button>
          <button data-type="feuer">Feuer</button>
          <button data-type="wasser">Wasser</button>
          <button data-type="pflanze">Pflanze</button>
          <button data-type="elektro">Elektro</button>
        </div>
      </section>

      <!-- Item-Grid: Karten werden per JS aus der API gerendert -->
      <section id="pokemon-list" class="grid grid-cols-4 gap-4">
        <!-- Lazy load -->
      </section>
      <div id="pokemon-scroll-trigger" class="h-4"></div>

      <!-- Modal -->
      <div id="search-modal">
        <div>
          <!-- Modal-Kopfzeile -->
          <div>
            <div></div>
            <button id="modal-close-btn"></button>
          </div>

          <!-- Modal-Steckbrief -->
          <div>
            <div>
              <img id="modal-img" src="" alt="" />
            </div>
            <div>
              <h3 id="modal-name"></h3>
              <div id="modal-types"></div>
              <span id="modal-ability"></span>
            </div>
          </div>

          <!-- Modal-Statuswerte -->
          <div id="modal-stats"></div>

          <!-- Modal-Aktion -->
          <div>
            <button id="modal-catch-btn"></button>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div id="catch-toast">
        <span id="toast-message"></span>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
  <footer>
    
  </footer>
</html>
